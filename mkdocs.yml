# MkDocs Material 配置：整个学习库 → 手机可读的网页
# 本地预览：pip install mkdocs-material && mkdocs serve
# 线上发布：push 到 GitHub 后由 .github/workflows/deploy.yml 自动构建到 Pages

site_name: Agent 算法学习库
site_description: 从 Agent 工程师到 Agent 算法工程师 · 后训练与 Agentic RL 图文课程
site_url: https://zhangtyzzz.github.io/learning-agent/
repo_url: https://github.com/zhangtyzzz/learning-agent
repo_name: zhangtyzzz/learning-agent
edit_uri: edit/master/

# 以 docs/ 目录作为内容目录
docs_dir: docs
exclude_docs: |
  **/build_graph.py
  **/wiki_lint.py
  **/wiki_search.py
  **/*.jsonl
  **/*.svg.png

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切到浅色
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - pymdownx.smartsymbols

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra:
  social: []

