<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">R1 管线：五个阶段，每段解决上一段留下的病</text>

  <!-- base -->
  <rect x="40" y="80" width="150" height="60" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="115" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">DeepSeek V3</text>
  <text x="115" y="128" text-anchor="middle" font-size="12" fill="#9CA3AF">强 base</text>

  <!-- stage A -->
  <rect x="230" y="80" width="180" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="320" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">① cold start SFT</text>
  <text x="320" y="128" text-anchor="middle" font-size="12" fill="#475569">几千条长 CoT 样例</text>

  <!-- stage B -->
  <rect x="450" y="70" width="200" height="80" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="550" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">② 推理对齐 RL</text>
  <text x="550" y="120" text-anchor="middle" font-size="12" fill="#475569">GRPO + 规则奖励</text>
  <text x="550" y="140" text-anchor="middle" font-size="12" fill="#9CA3AF">语言混杂在此修</text>

  <!-- stage C -->
  <rect x="690" y="80" width="210" height="60" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="795" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#B45309">③ 拒绝采样 SFT</text>
  <text x="795" y="128" text-anchor="middle" font-size="12" fill="#475569">②的高分输出造 SFT 数据</text>

  <!-- stage D -->
  <rect x="450" y="220" width="450" height="76" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="675" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">④ 全场景 RL：推理(规则奖励) + 有用无害(RM 奖励)</text>
  <text x="675" y="274" text-anchor="middle" font-size="12.5" fill="#475569">把推理能力泛化到写作/通用任务，兼顾人类偏好</text>

  <!-- stage E -->
  <rect x="90" y="220" width="280" height="76" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
  <text x="230" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#B91C1C">⑤ 蒸馏：R1 → 小模型 (1.5B-70B)</text>
  <text x="230" y="274" text-anchor="middle" font-size="12.5" fill="#991B1B">小模型直接 SFT 大模型的思维链</text>

  <line x1="190" y1="110" x2="224" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="110" x2="444" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="110" x2="684" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 795 140 C 795 190, 740 220, 720 230" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 560 150 C 560 180, 600 200, 640 220" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 450 258 C 400 258, 385 258, 376 258" fill="none" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- key findings -->
  <rect x="70" y="330" width="830" height="110" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="485" y="356" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">R1-Zero 的两个关键发现（跳过①②直接 RL 的实验）</text>
  <text x="255" y="386" text-anchor="middle" font-size="13.5" fill="#374151">纯 RLVR 也能长出长思维链与「顿悟」反思行为（能力可被奖励唤起）</text>
  <text x="715" y="386" text-anchor="middle" font-size="13.5" fill="#374151">但可读性差、语言混杂 → cold start 与多阶段才成为必需</text>
  <text x="485" y="416" text-anchor="middle" font-size="13.5" fill="#6B7280">蒸馏 vs RL 的结论：小模型直接蒸馏更强；但「更大算力的 RL」上限更高——两条路线不矛盾</text>
</svg>
