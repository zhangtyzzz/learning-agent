<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">RM 的一生：偏好数据 → 训练 → 打分 → 三种用法</text>

  <!-- training -->
  <rect x="50" y="90" width="250" height="110" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="175" y="120" text-anchor="middle" font-size="15.5" font-weight="600" fill="#374151">训练：偏好对</text>
  <text x="175" y="146" text-anchor="middle" font-size="13" fill="#4B5563">LLM + 标量头</text>
  <text x="175" y="172" text-anchor="middle" font-size="13" fill="#475569">L = −log σ(r_w − r_l)</text>

  <!-- model -->
  <rect x="390" y="90" width="180" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="480" y="120" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">奖励模型 RM</text>
  <text x="480" y="146" text-anchor="middle" font-size="13" fill="#475569">输入完整 (x, y)</text>
  <text x="480" y="172" text-anchor="middle" font-size="13" fill="#475569">输出一个标量</text>

  <!-- uses -->
  <rect x="660" y="60" width="230" height="52" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="775" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">用法① RL 的奖励信号</text>
  <rect x="660" y="122" width="230" height="52" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="775" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">用法② Best-of-N 重排</text>
  <rect x="660" y="184" width="230" height="52" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="775" y="216" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">用法③ 数据筛选 / judge</text>

  <line x1="300" y1="145" x2="384" y2="145" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="130" x2="654" y2="94" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="150" x2="654" y2="150" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="170" x2="654" y2="206" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- warnings -->
  <rect x="70" y="280" width="800" height="110" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="470" y="308" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B91C1C">RM 的三个已知坑（全都有实证）</text>
  <text x="230" y="338" text-anchor="middle" font-size="13.5" fill="#374151">长度偏置：偏爱长回答</text>
  <text x="470" y="338" text-anchor="middle" font-size="13.5" fill="#374151">分布外失灵：没见过的类型乱打分</text>
  <text x="710" y="338" text-anchor="middle" font-size="13.5" fill="#374151">不可跨模型比较：只有分数差有意义</text>
  <text x="470" y="368" text-anchor="middle" font-size="13.5" fill="#6B7280">训练工程：几万对就够 · epoch 少（1-2）· lr 小——过拟合的 RM 上线必翻车</text>
</svg>
