<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">InstructGPT 三阶段：每一步都在为下一步铺路</text>

  <!-- stage 1 -->
  <rect x="40" y="80" width="260" height="130" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="170" y="110" text-anchor="middle" font-size="16.5" font-weight="600" fill="#374151">① SFT</text>
  <text x="170" y="136" text-anchor="middle" font-size="13" fill="#4B5563">数据：人写的示范回答</text>
  <text x="170" y="160" text-anchor="middle" font-size="13" fill="#4B5563">目标：模仿（交叉熵）</text>
  <text x="170" y="188" text-anchor="middle" font-size="13" fill="#9CA3AF">产出：会对话的模型 = π_ref</text>

  <!-- stage 2 -->
  <rect x="340" y="80" width="260" height="130" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="470" y="110" text-anchor="middle" font-size="16.5" font-weight="600" fill="#047857">② 训练奖励模型</text>
  <text x="470" y="136" text-anchor="middle" font-size="13" fill="#475569">数据：人对回答排序（偏好对）</text>
  <text x="470" y="160" text-anchor="middle" font-size="13" fill="#475569">目标：σ(分数差) → 1</text>
  <text x="470" y="188" text-anchor="middle" font-size="13" fill="#9CA3AF">产出：给任何回答打分的 RM</text>

  <!-- stage 3 -->
  <rect x="640" y="80" width="260" height="130" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="770" y="110" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">③ PPO 强化学习</text>
  <text x="770" y="136" text-anchor="middle" font-size="13" fill="#475569">数据：模型自己生成的回答</text>
  <text x="770" y="160" text-anchor="middle" font-size="13" fill="#475569">目标：RM 分数最高 − β·KL</text>
  <text x="770" y="188" text-anchor="middle" font-size="13" fill="#9CA3AF">产出：对齐后的最终模型</text>

  <line x1="300" y1="145" x2="334" y2="145" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="145" x2="634" y2="145" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="470" y="240" text-anchor="middle" font-size="14" fill="#6B7280">①的输出是②的标注对象、③的参考策略 π_ref　｜　②的 RM 是③的奖励来源</text>

  <!-- why each stage -->
  <rect x="70" y="270" width="800" height="120" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="470" y="298" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">为什么缺一不可</text>
  <text x="240" y="326" text-anchor="middle" font-size="13.5" fill="#374151">① 只见正例：教「什么是好的」</text>
  <text x="470" y="326" text-anchor="middle" font-size="13.5" fill="#374151">② 有了负例：教「什么更好什么更差」</text>
  <text x="710" y="326" text-anchor="middle" font-size="13.5" fill="#374151">③ 用自己的输出学：突破示范者上限</text>
  <text x="470" y="362" text-anchor="middle" font-size="13.5" fill="#6B7280">RL 部分若没有 KL 拴住 π_ref：RM 分数虚高、语言退化——「讨好打分器」而非「真的变好」</text>
</svg>
