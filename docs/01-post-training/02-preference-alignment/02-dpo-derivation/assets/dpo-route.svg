<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">DPO 推导路线：四步，把 RLHF 目标变成一行 loss</text>

  <!-- step 1 -->
  <rect x="60" y="70" width="200" height="92" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="160" y="100" text-anchor="middle" font-size="15.5" font-weight="600" fill="#374151">① RLHF 目标</text>
  <text x="160" y="128" text-anchor="middle" font-size="13" fill="#4B5563">最大化 RM 分数</text>
  <text x="160" y="150" text-anchor="middle" font-size="13" fill="#475569">− β·KL(π‖π_ref)</text>

  <!-- step 2 -->
  <rect x="370" y="70" width="200" height="92" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="470" y="100" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">② 最优策略闭式解</text>
  <text x="470" y="128" text-anchor="middle" font-size="13" fill="#475569">数学技巧：写成正比形式</text>
  <text x="470" y="150" text-anchor="middle" font-size="13" fill="#475569">再补一个归一化分母 Z(x)</text>

  <!-- step 3 -->
  <rect x="680" y="70" width="200" height="92" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="780" y="100" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">③ 反解 reward</text>
  <text x="780" y="128" text-anchor="middle" font-size="13" fill="#475569">用 π 与 π_ref 表达 r</text>
  <text x="780" y="150" text-anchor="middle" font-size="13" fill="#475569">带上一个未知常数项</text>

  <!-- step 4 -->
  <rect x="180" y="250" width="580" height="110" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="470" y="282" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">④ 代入 Bradley-Terry：常数项相消！</text>
  <text x="470" y="314" text-anchor="middle" font-size="13" fill="#374151">P(y_w ≻ y_l) = σ( β·[logπ(y_w)/π_ref(y_w) − logπ(y_l)/π_ref(y_l)] )</text>
  <text x="470" y="342" text-anchor="middle" font-size="13.5" fill="#92400E">只剩 policy 项 → DPO loss = −log P，不再需要 RM 与采样</text>

  <line x1="260" y1="116" x2="364" y2="116" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="116" x2="674" y2="116" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 780 162 C 780 220, 700 250, 656 268" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- key insight -->
  <rect x="120" y="396" width="700" height="56" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="470" y="420" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B91C1C">全程无采样、无 RM 训练：偏好数据直接变成监督信号（离线、稳定、便宜）</text>
  <text x="470" y="442" text-anchor="middle" font-size="13.5" fill="#374151">代价：数据是「离线」的——模型接触不到自己当前分布的输出，这是 DPO 家族共同的天花板</text>
</svg>
