<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">verl（HybridFlow）：采样与训练两台引擎，权重定期同步</text>

  <!-- RL loop -->
  <rect x="70" y="90" width="380" height="120" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="260" y="120" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">Rollout 引擎（vLLM）</text>
  <text x="260" y="148" text-anchor="middle" font-size="13" fill="#475569">批量并发生成回答</text>
  <text x="260" y="174" text-anchor="middle" font-size="13" fill="#475569">推理速度优化：paged attention</text>
  <text x="260" y="198" text-anchor="middle" font-size="13" fill="#9CA3AF">未来的策略住在这里</text>

  <rect x="490" y="90" width="380" height="120" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="680" y="120" text-anchor="middle" font-size="16" font-weight="600" fill="#047857">训练引擎（FSDP / Megatron）</text>
  <text x="680" y="148" text-anchor="middle" font-size="13" fill="#475569">算 advantage + PPO/GRPO 更新</text>
  <text x="680" y="174" text-anchor="middle" font-size="13" fill="#475569">训完把新权重推回 rollout</text>
  <text x="680" y="198" text-anchor="middle" font-size="13" fill="#9CA3AF">actor / critic / ref 可分可合</text>

  <path d="M 450 140 L 484 140" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 490 185 C 460 210, 470 210, 456 202" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="470" y="236" text-anchor="middle" font-size="13.5" fill="#374151">数据（prompt + 回答 + 分数）→　｜　← 权重同步（同步点 = off-policy 程度）</text>

  <!-- reward sources -->
  <rect x="70" y="270" width="800" height="120" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="470" y="300" text-anchor="middle" font-size="16" font-weight="600" fill="#B45309">RLVR：奖励从「学的」换成「验的」</text>
  <text x="220" y="332" text-anchor="middle" font-size="13.5" fill="#374151">数学：答案匹配</text>
  <text x="470" y="332" text-anchor="middle" font-size="13.5" fill="#374151">代码：跑单元测试 / 编译</text>
  <text x="700" y="332" text-anchor="middle" font-size="13.5" fill="#374151">格式：正则查结构</text>
  <text x="470" y="364" text-anchor="middle" font-size="13.5" fill="#92400E">验证器不会 Goodhart 成「讨好 RM」——这就是它点燃推理 RL 的原因（但验证器本身仍可被钻，到 Agent 模块再讲）</text>

  <text x="470" y="424" text-anchor="middle" font-size="14" fill="#9CA3AF">实践入口：verl 的 GSM8K GRPO example 就是 P3——跑通后逐行读 advantage 与 KL 的实现</text>
</svg>
