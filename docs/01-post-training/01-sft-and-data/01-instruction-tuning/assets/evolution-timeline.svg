<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">指令数据四年演进：从「堆数量」到「拼质量」</text>

  <!-- timeline axis -->
  <line x1="70" y1="200" x2="880" y2="200" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- FLAN -->
  <circle cx="130" cy="200" r="8" fill="#6B7280"/>
  <rect x="60" y="80" width="170" height="92" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="145" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#374151">FLAN (2021-22)</text>
  <text x="145" y="132" text-anchor="middle" font-size="12.5" fill="#4B5563">~10³ 任务 × 集合</text>
  <text x="145" y="154" text-anchor="middle" font-size="12.5" fill="#9CA3AF">贡献：任务多样化</text>

  <!-- Alpaca -->
  <circle cx="340" cy="200" r="8" fill="#3B82F6"/>
  <rect x="270" y="80" width="170" height="92" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="355" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Alpaca (2023)</text>
  <text x="355" y="132" text-anchor="middle" font-size="12.5" fill="#4B5563">52k 合成指令</text>
  <text x="355" y="154" text-anchor="middle" font-size="12.5" fill="#9CA3AF">贡献：合成数据闭环</text>

  <!-- LIMA -->
  <circle cx="550" cy="200" r="8" fill="#10B981"/>
  <rect x="480" y="80" width="170" height="92" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="565" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">LIMA (2023)</text>
  <text x="565" y="132" text-anchor="middle" font-size="12.5" fill="#4B5563">仅 1k 精品</text>
  <text x="565" y="154" text-anchor="middle" font-size="12.5" fill="#9CA3AF">贡献：质量 &gt; 数量</text>

  <!-- Tulu3 -->
  <circle cx="770" cy="200" r="8" fill="#F59E0B"/>
  <rect x="700" y="80" width="170" height="92" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="785" y="108" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Tulu 3 (2024)</text>
  <text x="785" y="132" text-anchor="middle" font-size="12.5" fill="#4B5563">~940k 全流程</text>
  <text x="785" y="154" text-anchor="middle" font-size="12.5" fill="#9CA3AF">贡献：现代开源配方</text>

  <!-- years under axis -->
  <text x="130" y="230" text-anchor="middle" font-size="13" fill="#9CA3AF">2021</text>
  <text x="340" y="230" text-anchor="middle" font-size="13" fill="#9CA3AF">2023 初</text>
  <text x="550" y="230" text-anchor="middle" font-size="13" fill="#9CA3AF">2023 中</text>
  <text x="770" y="230" text-anchor="middle" font-size="13" fill="#9CA3AF">2024 底</text>

  <!-- takeaway -->
  <rect x="120" y="272" width="700" height="62" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="470" y="298" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">结论：数量红利很快见顶，质量与多样性成为 SFT 数据的胜负手</text>
  <text x="470" y="322" text-anchor="middle" font-size="13.5" fill="#374151">Tulu 3 的量级回升是因为「任务覆盖 + 能力配比」——不是回到堆数量时代</text>
</svg>
