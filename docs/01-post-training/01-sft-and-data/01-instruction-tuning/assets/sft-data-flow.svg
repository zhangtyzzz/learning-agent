<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">SFT：只对「回答」算损失，指令部分被遮住</text>

  <!-- prompt block -->
  <rect x="50" y="90" width="250" height="120" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="175" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">指令 prompt x</text>
  <text x="175" y="150" text-anchor="middle" font-size="13" fill="#6B7280">「把这段话翻译成英文：」</text>
  <text x="175" y="176" text-anchor="middle" font-size="13" fill="#6B7280">＋ chat template 包裹</text>
  <text x="175" y="198" text-anchor="middle" font-size="13.5" font-weight="600" fill="#B91C1C">loss mask：✗ 不算损失</text>

  <!-- response block -->
  <rect x="380" y="90" width="250" height="120" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="505" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#047857">标准回答 y*</text>
  <text x="505" y="150" text-anchor="middle" font-size="13" fill="#475569">"Here is the translation…"</text>
  <text x="505" y="176" text-anchor="middle" font-size="13" fill="#475569">逐 token 拼接</text>
  <text x="505" y="198" text-anchor="middle" font-size="13.5" font-weight="600" fill="#047857">loss mask：✓ 逐 token 算损失</text>

  <line x1="300" y1="150" x2="374" y2="150" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- model + loss -->
  <rect x="700" y="90" width="190" height="120" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="795" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">模型 πθ</text>
  <text x="795" y="150" text-anchor="middle" font-size="13" fill="#475569">逐 token 预测</text>
  <text x="795" y="176" text-anchor="middle" font-size="13" fill="#475569">交叉熵损失</text>

  <line x1="630" y1="150" x2="694" y2="150" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- loss formula strip -->
  <rect x="70" y="260" width="800" height="52" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="470" y="292" text-anchor="middle" font-size="17" fill="#111827">L_SFT = − (1/|y*|) · Σ_t log πθ( y*_t | x, y*_{&lt;t} )　只对回答部分的 t 求和</text>

  <!-- key point -->
  <text x="470" y="350" text-anchor="middle" font-size="15" fill="#374151">本质：对「人类怎么回答」做模仿学习（behavior cloning）——数据决定上限</text>
  <text x="470" y="382" text-anchor="middle" font-size="14" fill="#6B7280">「loss 只算 response」是最常被写错的工程细节：忘加 mask → loss 虚低、模型学不会好好回答</text>
</svg>
