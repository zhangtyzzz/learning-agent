<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">回报 G：未来奖励的「打折」总和</text>

  <!-- axis -->
  <line x1="80" y1="170" x2="820" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="175" font-size="14" fill="#374151">t</text>

  <!-- ticks -->
  <line x1="130" y1="165" x2="130" y2="175" stroke="#374151" stroke-width="2"/>
  <text x="130" y="196" text-anchor="middle" font-size="14" fill="#374151">现在</text>
  <line x1="300" y1="165" x2="300" y2="175" stroke="#374151" stroke-width="2"/>
  <text x="300" y="196" text-anchor="middle" font-size="14" fill="#374151">t+1</text>
  <line x1="470" y1="165" x2="470" y2="175" stroke="#374151" stroke-width="2"/>
  <text x="470" y="196" text-anchor="middle" font-size="14" fill="#374151">t+2</text>
  <line x1="640" y1="165" x2="640" y2="175" stroke="#374151" stroke-width="2"/>
  <text x="640" y="196" text-anchor="middle" font-size="14" fill="#374151">t+3</text>
  <line x1="790" y1="165" x2="790" y2="175" stroke="#9CA3AF" stroke-width="2"/>
  <text x="790" y="196" text-anchor="middle" font-size="14" fill="#9CA3AF">T（episode 结束）</text>

  <!-- reward bars, shrinking = discounting -->
  <rect x="115" y="100" width="30" height="70" rx="4" fill="#3B82F6"/>
  <text x="130" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">r(t+1)</text>

  <rect x="285" y="118" width="30" height="52" rx="4" fill="#60A5FA"/>
  <text x="300" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">γ·r(t+2)</text>

  <rect x="455" y="132" width="30" height="38" rx="4" fill="#93C5FD"/>
  <text x="470" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">γ²·r(t+3)</text>

  <rect x="775" y="150" width="30" height="20" rx="4" fill="#BFDBFE"/>
  <text x="790" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">γ^(T-1)·r(T)</text>

  <!-- formula -->
  <rect x="120" y="228" width="660" height="52" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="450" y="260" text-anchor="middle" font-size="17" fill="#111827">G(t) = r(t+1) + γ·r(t+2) + γ²·r(t+3) + γ³·r(t+4) + …</text>

  <text x="130" y="238" font-size="14" fill="#6B7280"></text>
</svg>
