<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="450" y="50" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">强化学习 = 在这个循环里，把长期累计回报最大化</text>

  <!-- Agent -->
  <rect x="70" y="110" width="200" height="100" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="170" y="152" text-anchor="middle" font-size="22" font-weight="600" fill="#1D4ED8">Agent 智能体</text>
  <text x="170" y="182" text-anchor="middle" font-size="14" fill="#475569">策略 π(a|s)，也就是你的 LLM</text>

  <!-- Environment -->
  <rect x="630" y="110" width="200" height="100" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="730" y="152" text-anchor="middle" font-size="22" font-weight="600" fill="#047857">Environment 环境</text>
  <text x="730" y="182" text-anchor="middle" font-size="14" fill="#475569">验证器 / RM / 工具</text>

  <!-- action arrow (top) -->
  <line x1="274" y1="132" x2="622" y2="132" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="448" y="120" text-anchor="middle" font-size="16" fill="#111827">动作 a(t)：生成下一个 token</text>

  <!-- state & reward arrow (bottom) -->
  <line x1="626" y1="188" x2="278" y2="188" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="448" y="216" text-anchor="middle" font-size="16" fill="#111827">新状态 s(t+1) ＋ 奖励 r(t+1)</text>

  <!-- trajectory note -->
  <rect x="120" y="258" width="660" height="44" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="450" y="286" text-anchor="middle" font-size="15" fill="#374151">一条轨迹 τ = (s₀, a₀, r₁, s₁, a₁, r₂, …)　·　一局游戏 = 一个 episode</text>
</svg>
