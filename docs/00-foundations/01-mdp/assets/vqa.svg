<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">同一个状态、三个动作：Q、V、A 的关系</text>

  <!-- V baseline (dashed) -->
  <line x1="90" y1="190" x2="810" y2="190" stroke="#6B7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="820" y="195" font-size="15" fill="#374151">V(s) = 3</text>
  <text x="820" y="215" font-size="12" fill="#6B7280">平均水平</text>

  <!-- a1: A=+4 -->
  <rect x="170" y="102" width="80" height="88" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5"/>
  <text x="210" y="88" text-anchor="middle" font-size="17" font-weight="600" fill="#047857">A = +4</text>
  <text x="210" y="130" text-anchor="middle" font-size="14" fill="#065F46">Q = 7</text>

  <!-- a2: A=0 -->
  <rect x="410" y="184" width="80" height="12" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
  <text x="450" y="170" text-anchor="middle" font-size="17" font-weight="600" fill="#4B5563">A = 0</text>
  <text x="450" y="216" text-anchor="middle" font-size="14" fill="#6B7280">Q = 3</text>

  <!-- a3: A=-4 -->
  <rect x="650" y="190" width="80" height="88" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
  <text x="690" y="302" text-anchor="middle" font-size="17" font-weight="600" fill="#B91C1C">A = −4</text>
  <text x="690" y="250" text-anchor="middle" font-size="14" fill="#991B1B">Q = −1</text>
  <text x="210" y="330" text-anchor="middle" font-size="15" fill="#111827">动作 a₁（好选择）</text>
  <text x="450" y="330" text-anchor="middle" font-size="15" fill="#111827">动作 a₂（平均水平）</text>
  <text x="690" y="330" text-anchor="middle" font-size="15" fill="#111827">动作 a₃（差选择）</text>

  <!-- formula strip -->
  <text x="450" y="362" text-anchor="middle" font-size="16" fill="#374151">优势 A(s,a) = Q(s,a) − V(s)：这个动作比「平均水平」好多少 —— RL 真正优化的就是它</text>
</svg>
