<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">Σ（大写 sigma）：把带下标的「全部加起来」</text>

  <!-- three bars -->
  <line x1="80" y1="210" x2="360" y2="210" stroke="#9CA3AF" stroke-width="1.5"/>
  <rect x="110" y="110" width="52" height="100" rx="4" fill="#3B82F6"/>
  <rect x="192" y="160" width="52" height="50" rx="4" fill="#60A5FA"/>
  <rect x="274" y="185" width="52" height="25" rx="4" fill="#BFDBFE"/>
  <text x="136" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">z₁ = 2.0</text>
  <text x="218" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">z₂ = 1.0</text>
  <text x="300" y="171" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">z₃ = 0.5</text>
  <text x="220" y="238" text-anchor="middle" font-size="14" fill="#6B7280">三个 token 各自的打分（真实场景是 15 万个）</text>

  <!-- big sigma -->
  <text x="470" y="175" text-anchor="middle" font-size="72" font-weight="600" fill="#111827">Σ</text>
  <text x="470" y="204" text-anchor="middle" font-size="17" fill="#6B7280">a</text>

  <line x1="380" y1="160" x2="416" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="524" y1="160" x2="560" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="570" y="122" width="200" height="76" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="670" y="155" text-anchor="middle" font-size="19" font-weight="600" fill="#047857">= 2.0 + 1.0 + 0.5</text>
  <text x="670" y="184" text-anchor="middle" font-size="21" font-weight="600" fill="#047857">= 3.5</text>

  <text x="450" y="284" text-anchor="middle" font-size="14.5" fill="#374151">Σ 底下的小字（这里是 a）= 「对谁求和」：对每一个 token 的打分，全部加在一起</text>
</svg>
