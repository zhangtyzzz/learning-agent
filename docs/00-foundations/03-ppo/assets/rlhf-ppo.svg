<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">RLHF 里的 PPO：同时跑着 4 个模型</text>

  <!-- prompt pool -->
  <rect x="50" y="70" width="170" height="58" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
  <text x="135" y="95" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Prompt 数据集</text>
  <text x="135" y="116" text-anchor="middle" font-size="12.5" fill="#6B7280">只要问题，不要答案</text>

  <!-- actor -->
  <rect x="50" y="180" width="200" height="86" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="150" y="212" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">Actor 策略 πθ</text>
  <text x="150" y="236" text-anchor="middle" font-size="12.5" fill="#475569">🔵 训练中（被更新的 LLM）</text>

  <line x1="135" y1="128" x2="135" y2="176" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- response -->
  <rect x="300" y="196" width="140" height="54" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="370" y="229" text-anchor="middle" font-size="15" font-weight="600" fill="#B45309">响应 y</text>
  <line x1="250" y1="223" x2="296" y2="223" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- RM -->
  <rect x="510" y="70" width="240" height="76" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="630" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#047857">Reward Model</text>
  <text x="630" y="126" text-anchor="middle" font-size="12.5" fill="#475569">❄️ 冻结 · 给整条响应打分 r</text>
  <path d="M 440 205 C 490 190, 500 130, 512 112" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Reference -->
  <rect x="510" y="182" width="240" height="76" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="630" y="212" text-anchor="middle" font-size="16" font-weight="600" fill="#047857">Reference π_ref</text>
  <text x="630" y="238" text-anchor="middle" font-size="12.5" fill="#475569">❄️ 冻结 · SFT 快照，算 KL 惩罚</text>
  <line x1="440" y1="223" x2="506" y2="223" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Critic -->
  <rect x="510" y="294" width="240" height="76" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="630" y="324" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">Critic V(s)</text>
  <text x="630" y="350" text-anchor="middle" font-size="12.5" fill="#475569">🔵 训练中 · 估计每个状态的价值</text>
  <path d="M 440 242 C 490 258, 500 316, 512 330" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- PPO update -->
  <rect x="120" y="382" width="700" height="48" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
  <text x="470" y="412" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B91C1C">PPO 更新：max(r·A, clip(r)·A) − β·KL　（r = 新旧策略概率比，A = RM 分数 − Critic 基线）</text>
  <path d="M 150 266 C 150 320, 200 370, 260 384" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 630 370 C 630 378, 620 382, 610 384" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 750 258 C 802 300, 812 348, 796 382" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 755 146 C 852 210, 862 330, 806 384" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
