<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="redA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
    <marker id="greenA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">TRPO → PPO 的核心直觉：只敢在「信任域」内迈步</text>

  <!-- trust region band -->
  <rect x="240" y="70" width="220" height="220" fill="#EFF6FF" opacity="0.6"/>
  <text x="350" y="92" text-anchor="middle" font-size="13.5" fill="#1D4ED8">信任域（clip 约束的范围）</text>

  <!-- performance curve: hill then cliff -->
  <path d="M 80 268 C 180 220, 260 130, 350 118 C 430 110, 470 150, 520 190 C 590 240, 680 272, 820 286" fill="none" stroke="#3B82F6" stroke-width="4"/>
  <text x="200" y="140" font-size="15" fill="#1D4ED8">性能 J(θ)</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="840" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="855" y="305" font-size="14" fill="#374151">θ</text>

  <!-- old policy point -->
  <circle cx="350" cy="118" r="7" fill="#1F2937"/>
  <text x="350" y="100" text-anchor="middle" font-size="14.5" fill="#111827">θ_old（当前策略）</text>

  <!-- good small step -->
  <path d="M 358 117 C 390 112, 415 110, 438 114" fill="none" stroke="#10B981" stroke-width="4.5" marker-end="url(#greenA)"/>
  <text x="452" y="108" font-size="14.5" fill="#047857">clip 后的小步 ✓</text>

  <!-- bad big step -->
  <path d="M 358 122 C 480 160, 580 230, 700 262" fill="none" stroke="#EF4444" stroke-width="4.5" stroke-dasharray="10 7" marker-end="url(#redA)"/>
  <text x="600" y="215" font-size="14.5" fill="#B91C1C">无约束的大步：策略更新过头，性能崩塌</text>

  <text x="450" y="332" text-anchor="middle" font-size="15" fill="#374151">策略梯度是「采一次样、更新一次」—— 步子一大，下一次采样分布就完全变了，旧数据全部作废</text>
</svg>
