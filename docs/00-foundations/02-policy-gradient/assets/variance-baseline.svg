<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="upG" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#3B82F6"/>
    </marker>
    <marker id="dnG" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#3B82F6"/>
    </marker>
    <marker id="dnR" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#EF4444"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">为什么要减 baseline：把「绝对回报」变成「相对好坏」</text>

  <!-- left panel -->
  <text x="240" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#1F2937">不用 baseline：直接用回报 G</text>
  <line x1="80" y1="200" x2="420" y2="200" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="72" y="205" text-anchor="end" font-size="12" fill="#6B7280">0</text>

  <line x1="130" y1="200" x2="130" y2="100" stroke="#3B82F6" stroke-width="5" marker-end="url(#upG)"/>
  <text x="130" y="90" text-anchor="middle" font-size="14" fill="#1D4ED8">G=+100</text>
  <line x1="205" y1="200" x2="205" y2="290" stroke="#3B82F6" stroke-width="5" marker-end="url(#dnG)"/>
  <text x="205" y="312" text-anchor="middle" font-size="14" fill="#1D4ED8">G=−80</text>
  <line x1="280" y1="200" x2="280" y2="112" stroke="#3B82F6" stroke-width="5" marker-end="url(#upG)"/>
  <text x="280" y="102" text-anchor="middle" font-size="14" fill="#1D4ED8">G=+90</text>
  <line x1="355" y1="200" x2="355" y2="272" stroke="#3B82F6" stroke-width="5" marker-end="url(#dnG)"/>
  <text x="355" y="294" text-anchor="middle" font-size="14" fill="#1D4ED8">G=−70</text>

  <text x="250" y="342" text-anchor="middle" font-size="14.5" fill="#B91C1C">忽正忽负、幅度巨大 → 梯度方差大，训练震荡</text>

  <!-- right panel -->
  <text x="700" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#1F2937">用 baseline：优势 A = G − b(s)</text>
  <line x1="540" y1="200" x2="880" y2="200" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="532" y="205" text-anchor="end" font-size="12" fill="#6B7280">0</text>

  <line x1="590" y1="200" x2="590" y2="164" stroke="#10B981" stroke-width="5" marker-end="url(#upG)"/>
  <text x="590" y="152" text-anchor="middle" font-size="14" fill="#047857">A=+3</text>
  <line x1="665" y1="200" x2="665" y2="228" stroke="#EF4444" stroke-width="5" marker-end="url(#dnR)"/>
  <text x="665" y="250" text-anchor="middle" font-size="14" fill="#B91C1C">A=−2</text>
  <line x1="740" y1="200" x2="740" y2="158" stroke="#10B981" stroke-width="5" marker-end="url(#upG)"/>
  <text x="740" y="146" text-anchor="middle" font-size="14" fill="#047857">A=+4</text>
  <line x1="815" y1="200" x2="815" y2="222" stroke="#EF4444" stroke-width="5" marker-end="url(#dnR)"/>
  <text x="815" y="244" text-anchor="middle" font-size="14" fill="#B91C1C">A=−3</text>

  <text x="710" y="342" text-anchor="middle" font-size="14.5" fill="#047857">只保留「比平均好多少」的信号 → 方差小，更新稳</text>
</svg>
