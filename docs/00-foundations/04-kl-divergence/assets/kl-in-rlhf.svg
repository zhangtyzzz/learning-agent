<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">RLHF 的奖励 = RM 打分 − β × 每个token的 KL</text>

  <!-- response box -->
  <rect x="50" y="115" width="190" height="86" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="145" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#B45309">响应 token 序列</text>
  <text x="145" y="176" text-anchor="middle" font-size="12.5" fill="#92400E">πθ 生成的回答</text>

  <!-- RM score -->
  <rect x="360" y="55" width="220" height="66" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="470" y="83" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">RM 打分 r(x, y)</text>
  <text x="470" y="106" text-anchor="middle" font-size="12.5" fill="#475569">「这个回答多好」</text>

  <!-- KL tax -->
  <rect x="360" y="190" width="220" height="66" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
  <text x="470" y="218" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B91C1C">KL 罚项：β × KL(πθ‖π_ref)</text>
  <text x="470" y="241" text-anchor="middle" font-size="12.5" fill="#991B1B">「离参考策略跑了多远」</text>

  <line x1="240" y1="135" x2="354" y2="98" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="240" y1="181" x2="354" y2="218" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- total -->
  <rect x="640" y="115" width="210" height="86" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="745" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">总奖励</text>
  <text x="745" y="176" text-anchor="middle" font-size="13.5" fill="#475569">r − β·KL（逐 token 累加）</text>

  <line x1="580" y1="88" x2="636" y2="130" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="223" x2="636" y2="184" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <text x="450" y="292" text-anchor="middle" font-size="15" fill="#374151">KL 罚项 = 对「偏离 SFT 参考策略」收的税：不给模型 RM 分数虚高的自由发挥空间</text>
</svg>
