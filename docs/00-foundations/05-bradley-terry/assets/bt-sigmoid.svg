<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">Bradley-Terry：把「谁更好」变成概率</text>

  <!-- good answer -->
  <rect x="50" y="62" width="260" height="76" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="180" y="92" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">好回答 y_w（人选择的）</text>
  <text x="180" y="120" text-anchor="middle" font-size="13.5" fill="#475569">RM 打分 r(y_w) = 2.0</text>

  <!-- bad answer -->
  <rect x="50" y="162" width="260" height="76" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5"/>
  <text x="180" y="192" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B91C1C">差回答 y_l（人拒绝的）</text>
  <text x="180" y="220" text-anchor="middle" font-size="13.5" fill="#991B1B">RM 打分 r(y_l) = 0.5</text>

  <!-- diff -->
  <rect x="420" y="115" width="150" height="70" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
  <text x="495" y="145" text-anchor="middle" font-size="15.5" font-weight="600" fill="#374151">差值 Δ</text>
  <text x="495" y="170" text-anchor="middle" font-size="14" fill="#6B7280">1.5</text>

  <line x1="310" y1="100" x2="414" y2="132" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="310" y1="200" x2="414" y2="168" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- sigmoid -->
  <rect x="660" y="108" width="200" height="84" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="760" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">σ(Δ) = 0.82</text>
  <text x="760" y="166" text-anchor="middle" font-size="13" fill="#475569">82% 概率 y_w ≻ y_l</text>

  <line x1="570" y1="150" x2="656" y2="150" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <text x="450" y="278" text-anchor="middle" font-size="15" fill="#374151">RM 的训练目标：对每条偏好数据，把 σ(r_w − r_l) 推向 1（交叉熵损失）</text>
</svg>
