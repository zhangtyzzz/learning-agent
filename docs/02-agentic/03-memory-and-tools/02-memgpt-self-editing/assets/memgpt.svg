<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">MemGPT：像操作系统管理内存一样管理上下文</text>

  <!-- main context -->
  <rect x="60" y="80" width="400" height="150" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="260" y="110" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">主上下文（LLM 窗口）</text>
  <rect x="90" y="128" width="340" height="36" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" fill="#374151">系统指令 + 关键记忆（自管理区）</text>
  <rect x="90" y="174" width="340" height="36" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="260" y="198" text-anchor="middle" font-size="13" fill="#374151">当前对话 / 工作队列</text>

  <!-- external -->
  <rect x="540" y="80" width="340" height="150" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="710" y="110" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">外置存储（无限但慢）</text>
  <rect x="570" y="128" width="280" height="36" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="710" y="152" text-anchor="middle" font-size="13" fill="#475569">对话历史归档（情景记忆）</text>
  <rect x="570" y="174" width="280" height="36" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="710" y="198" text-anchor="middle" font-size="13" fill="#475569">结构化档案（语义记忆）</text>

  <!-- self-editing -->
  <rect x="180" y="290" width="580" height="90" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="470" y="320" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">自管理：记忆编辑 = 一组「记忆函数」工具调用</text>
  <text x="470" y="348" text-anchor="middle" font-size="13" fill="#475569">archival_memory_insert · archival_memory_search · core_memory_replace …</text>
  <text x="470" y="370" text-anchor="middle" font-size="12.5" fill="#6B7280">换页 / 检索 / 修改，全部由模型自己决定何时发起</text>

  <line x1="260" y1="230" x2="260" y2="284" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="230" x2="710" y2="284" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="470" y="414" text-anchor="middle" font-size="14" fill="#374151">OS 隐喻：主存↔磁盘换页。因为编辑是「工具调用」，天然可进训练数据 → 可被 RL 目标化</text>
</svg>
