<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">自我改进闭环：生成 → 评估 → 训练，三处都可以「自我化」</text>

  <!-- generate -->
  <rect x="70" y="100" width="230" height="90" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="185" y="132" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">① 生成</text>
  <text x="185" y="160" text-anchor="middle" font-size="12.5" fill="#475569">模型自己产轨迹/回答</text>
  <text x="185" y="180" text-anchor="middle" font-size="12" fill="#9CA3AF">Self-Rewarding · SPIN</text>

  <!-- evaluate -->
  <rect x="360" y="100" width="230" height="90" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="475" y="132" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">② 评估</text>
  <text x="475" y="160" text-anchor="middle" font-size="12.5" fill="#475569">LLM-as-judge / 可验证器</text>
  <text x="475" y="180" text-anchor="middle" font-size="12" fill="#9CA3AF">偏好对自动生成</text>

  <!-- train -->
  <rect x="650" y="100" width="230" height="90" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="765" y="132" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">③ 训练</text>
  <text x="765" y="160" text-anchor="middle" font-size="12.5" fill="#475569">DPO / RL 用自家数据更新</text>
  <text x="765" y="180" text-anchor="middle" font-size="12" fill="#9CA3AF">SPIN 自博弈 · SCoRe 两阶段</text>

  <line x1="300" y1="145" x2="354" y2="145" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="145" x2="644" y2="145" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 765 190 C 765 300, 185 300, 185 196" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="470" y="322" text-anchor="middle" font-size="14.5" font-weight="600" fill="#047857">更强的模型 → 生成更好 → 评得更准 → 训得更好（飞轮）</text>

  <!-- ceiling -->
  <rect x="70" y="350" width="810" height="60" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="475" y="376" text-anchor="middle" font-size="14.5" font-weight="600" fill="#B91C1C">天花板公式：闭环质量 ≤ 评估质量。judge 偏差（偏爱长/顺口/自家风格）每转一圈放大一次</text>
  <text x="475" y="398" text-anchor="middle" font-size="13" fill="#991B1B">可验证任务（数学/代码）闭环最稳：评估不靠模型 opinion → 先挑这类任务做自我改进</text>
</svg>
