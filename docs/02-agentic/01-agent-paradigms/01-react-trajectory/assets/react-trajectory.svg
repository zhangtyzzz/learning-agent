<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">一条 ReAct 轨迹，在 RL 眼里的解剖图</text>

  <!-- trajectory segments -->
  <rect x="50" y="80" width="120" height="60" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="110" y="106" text-anchor="middle" font-size="13.5" font-weight="600" fill="#374151">任务 prompt</text>
  <text x="110" y="128" text-anchor="middle" font-size="11.5" fill="#9CA3AF">s₀</text>

  <rect x="190" y="80" width="140" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="260" y="106" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1D4ED8">思考：我该先…</text>
  <text x="260" y="128" text-anchor="middle" font-size="11.5" fill="#475569">动作（模型生成）</text>

  <rect x="350" y="80" width="150" height="60" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="425" y="106" text-anchor="middle" font-size="13.5" font-weight="600" fill="#047857">行动：search(暴跌原因)</text>
  <text x="425" y="128" text-anchor="middle" font-size="11.5" fill="#475569">动作（工具调用）</text>

  <rect x="520" y="80" width="180" height="60" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="610" y="106" text-anchor="middle" font-size="13.5" font-weight="600" fill="#B45309">观察：搜索结果…</text>
  <text x="610" y="128" text-anchor="middle" font-size="11.5" fill="#92400E">环境反馈（非模型生成）</text>

  <rect x="720" y="80" width="170" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="805" y="106" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1D4ED8">思考 → 行动 → …</text>
  <text x="805" y="128" text-anchor="middle" font-size="11.5" fill="#475569">循环到最终回答</text>

  <line x1="170" y1="110" x2="184" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="110" x2="344" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="110" x2="514" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="110" x2="714" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- RL translation table as boxes -->
  <rect x="60" y="190" width="830" height="130" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="475" y="220" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">RL 语言翻译</text>
  <text x="240" y="252" text-anchor="middle" font-size="13.5" fill="#374151">状态 s_t = 之前全部内容</text>
  <text x="530" y="252" text-anchor="middle" font-size="13.5" fill="#374151">动作 a_t = 每个生成的 token</text>
  <text x="770" y="252" text-anchor="middle" font-size="13.5" fill="#374151">轨迹 τ = 整条多轮对话</text>
  <text x="300" y="292" text-anchor="middle" font-size="13.5" fill="#6B7280">观察 token 不算 loss（不是模型生成的）——multi-turn RL 的第一个 mask 规则</text>

  <text x="475" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">关键视角：每个 prompt 技巧 = 一次「手工塑形轨迹分布」</text>
  <text x="475" y="390" text-anchor="middle" font-size="13.5" fill="#6B7280">ReAct 把推理外化成可执行的行动 → 轨迹可被评测 → 才有了后来 agentic RL 的一切</text>
</svg>
