<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="470" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">从「示范」到「探索」：agent 训练的三代</text>

  <line x1="80" y1="210" x2="880" y2="210" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- gen 1 -->
  <circle cx="170" cy="210" r="9" fill="#6B7280"/>
  <rect x="80" y="80" width="200" height="100" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="2.5"/>
  <text x="180" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">一代：SFT 示范</text>
  <text x="180" y="134" text-anchor="middle" font-size="12.5" fill="#4B5563">WebGPT · AgentTuning · FireAct</text>
  <text x="180" y="158" text-anchor="middle" font-size="12.5" fill="#9CA3AF">人类/强模型轨迹 → 模仿</text>

  <!-- gen 2 -->
  <circle cx="470" cy="210" r="9" fill="#3B82F6"/>
  <rect x="370" y="80" width="200" height="100" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="470" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">二代：环境平台</text>
  <text x="470" y="134" text-anchor="middle" font-size="12.5" fill="#475569">AgentGym · 统一接口</text>
  <text x="470" y="158" text-anchor="middle" font-size="12.5" fill="#9CA3AF">多环境可交互，为 RL 铺路</text>

  <!-- gen 3 -->
  <circle cx="770" cy="210" r="9" fill="#10B981"/>
  <rect x="660" y="80" width="220" height="100" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="770" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">三代：在线 RL</text>
  <text x="770" y="134" text-anchor="middle" font-size="12.5" fill="#475569">WebRL 课程 · ToolRL · Search-R1</text>
  <text x="770" y="158" text-anchor="middle" font-size="12.5" fill="#9CA3AF">环境里自己探索 + 奖励塑形</text>

  <!-- bottleneck row -->
  <rect x="80" y="260" width="200" height="80" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="180" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#B91C1C">瓶颈：示范者上限</text>
  <text x="180" y="312" text-anchor="middle" font-size="12" fill="#991B1B">轨迹只来自人/强模型</text>

  <rect x="370" y="260" width="200" height="80" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="470" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#B91C1C">瓶颈：还是 SFT</text>
  <text x="470" y="312" text-anchor="middle" font-size="12" fill="#991B1B">有了环境但没探索</text>

  <rect x="660" y="260" width="220" height="80" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="770" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#B45309">瓶颈转移：环境数据 + credit</text>
  <text x="770" y="312" text-anchor="middle" font-size="12" fill="#92400E">→ 当前研究主战场</text>

  <line x1="280" y1="300" x2="364" y2="300" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="300" x2="654" y2="300" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="470" y="376" text-anchor="middle" font-size="14.5" fill="#374151">演进的推动力始终是同一个：SFT 只能到示范者水平，突破上限必须让模型自己探索（RL）</text>
</svg>
